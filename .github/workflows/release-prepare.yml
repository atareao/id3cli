name: Prepare Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Install vampus
        run: cargo install vampus --git https://github.com/atareao/vampus

      - name: Determine bump type from commits
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          COMMITS=$(git log "$LAST_TAG"..HEAD --format="%s")
          if echo "$COMMITS" | grep -q "BREAKING CHANGE\|!:"; then
            echo "type=--major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -q "^feat"; then
            echo "type=--minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=--patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version with vampus
        run: vampus upgrade ${{ steps.bump.outputs.type }}

      - name: Get new version
        id: version
        run: |
          V=$(grep '^current_version' .vampus.yml | sed 's/.*: *//')
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: git-cliff -o CHANGELOG.md --tag "v${{ steps.version.outputs.value }}"

      - name: Commit, tag and push
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release v${V}"
          git tag "v${V}"
          git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}" main
          git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}" "v${V}"
          gh workflow run release.yml --ref "v${V}"

      - name: Sync development with main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" main:development --force