# Configuración de SonarQube Cloud para id3cli.
# La clave del proyecto y la organización las asigna Sonar al importar el repo.
sonar.projectKey=atareao_id3cli
sonar.organization=atareao
sonar.projectName=id3cli

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Cobertura generada por `cargo llvm-cov` en el job `test`.
sonar.rust.lcov.reportPaths=lcov.info

# target/ son artefactos de compilación. scripts/ es orquestación e2e en bash.
# tests/fixtures/ son binarios de audio versionados (mp3, m4a, ogg, opus, flac):
# el escáner no los analiza y solo ensucian el resumen de "archivos no analizados".
sonar.exclusions=target/**,scripts/**,tests/fixtures/**

# src/tests.rs repite a propósito la misma estructura por formato (mp3, m4a, ogg,
# opus, flac). Es el patrón del oráculo, no duplicación de deuda técnica.
sonar.cpd.exclusions=src/tests.rs
