[package]
name = "id3cli"
version = "0.8.0"
edition = "2024"
description = "CLI para leer y escribir metadatos ID3v2.4 en MP3, átomos estilo iTunes (ilst) en MP4 y comentarios Vorbis en OGG, Opus y FLAC"
license = "MIT"
repository = "https://github.com/atareao/id3cli"
homepage = "https://github.com/atareao/id3cli"
keywords = ["id3", "mp3", "mp4", "metadata", "cli"]
categories = ["command-line-utilities", "multimedia::audio", "filesystem"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[dependencies]
lofty = "0.25"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# El backend anterior, solo para tests: la red de seguridad de integración
# relee los tags escritos por `lofty` con la librería `id3`, de modo que la
# verificación es entre librerías (lofty escribe, id3 lee). La producción no
# lo usa: `cargo tree -e normal` NO muestra `id3`.
id3 = "1.16.4"
